<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Selo e legenda</title>
<style>
  html, body { margin: 0; width: 720px; height: 1280px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 720px; height: 1280px; font-family: "DejaVu Sans", sans-serif; }
  .selo {
    position: absolute; top: 120px; right: 56px;
    padding: 20px 32px; border-radius: 28px;
    background: #ffd400; color: #1b1b1b;
    font-size: 64px; font-weight: 700; letter-spacing: -1px;
    transform-origin: 50% 50%;
  }
  .legenda {
    position: absolute; left: 48px; right: 48px; bottom: 220px;
    text-align: center; color: #ffffff;
    font-size: 60px; font-weight: 700; line-height: 1.2;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
  }
  .legenda span { display: inline-block; margin: 0 8px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="720" data-height="1280">
  <div id="selo" class="clip selo" data-start="0" data-duration="10" data-track-index="1">R$ 49,90</div>
  <div id="linha1" class="clip legenda" data-start="0" data-duration="5" data-track-index="2"><span>Esse</span><span>produto</span><span>mudou</span><span>minha</span><span>rotina</span></div>
  <div id="linha2" class="clip legenda" data-start="5" data-duration="5" data-track-index="3"><span>Corre</span><span>que</span><span>acaba</span><span>hoje</span></div>
</div>
<script src="gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  // Selo: entra em 1 s com escala.
  tl.fromTo("#selo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, 1);
  // Legenda: uma palavra a cada 0,7 s.
  document.querySelectorAll("#linha1 span").forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.2 }, 0 + i * 0.7));
  document.querySelectorAll("#linha2 span").forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.2 }, 5 + i * 0.7));
  tl.set({}, {}, 10);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;
</script>
</body>
</html>

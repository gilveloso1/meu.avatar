<meta charset="utf-8">
<title>Canvas com tldraw</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=delete,flag,image,movie,music_note,pause,play_arrow,upload,video_library,volume_off&display=block">
<style>
/*THEME*/
/*ESTILO*/
.stage { position: relative; min-width: 0; min-height: 0; }
.stage .tl-container { position: absolute; inset: 0; }
.bar .hint { font-size: 12px; white-space: nowrap; }
.blk { box-sizing: border-box; border-radius: 12px; overflow: hidden; background: var(--md-sys-color-surface-container-highest); box-shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 1px 3px 1px rgb(0 0 0 / 0.15); }
.blk__media { position: absolute; inset: 0; background-repeat: repeat-x; background-size: auto 100%; }
.blk--audio { background: var(--md-sys-color-tertiary-container); border-radius: 8px; }
.blk--audio .blk__media { background-repeat: no-repeat; opacity: 0.7; }
.blk.is-mute .blk__media { filter: grayscale(0.6); }
.blk__label { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 4px; padding: 4px 8px; font: 500 12px/16px var(--font); color: #fff; background: linear-gradient(transparent, rgb(0 0 0 / 0.65)); white-space: nowrap; }
.blk--audio .blk__label { top: 0; bottom: auto; background: none; color: var(--md-sys-color-on-tertiary-container); }
.blk__label .ms { font-size: 16px; }
.blk__name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.blk__dur { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.85; }
.fin { box-sizing: border-box; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; align-content: center; column-gap: 12px; padding: 0 16px; border-radius: 16px; background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); box-shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 1px 3px 1px rgb(0 0 0 / 0.15); }
.fin .ms { grid-row: span 2; font-size: 28px; align-self: center; }
.fin b { font: 500 16px/24px var(--font); }
</style>
<div id="root"></div>

# Roda em todo PR, sem segredos: os testes usam a API falsa e não publicam nada.
name: Testes
on:
  pull_request:
  push:
    branches: [main]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run teste:canvas
      - run: python3 -m py_compile container/*.py

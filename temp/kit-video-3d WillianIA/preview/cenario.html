<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview do cenário</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="ui">
  <nav><a href="/preview/index.html">Personagens</a><a class="on" href="/preview/cenario.html">Cenário</a></nav>
  <label>Categoria <select id="cat"></select></label>
  <label>Asset <select id="asset"></select></label>
  <label class="check"><input id="variants" type="checkbox"> Mostrar variantes</label>
  <label class="check"><input id="scale" type="checkbox"> Mostrar escala (personagem)</label>
  <label class="check"><input id="rotate" type="checkbox"> Girar</label>
  <label class="check"><input id="auto" type="checkbox"> Animar etapas</label>
  <label>Etapa <input id="progress" type="range" min="0" max="1" step="0.01" value="1"></label>
  <label>Horário
    <select id="time"><option value="dia">Dia</option><option value="tarde">Fim de tarde</option><option value="nublado">Nublado</option></select>
  </label>
  <div class="row"><button id="cam">Câmera</button></div>
  <div id="info"></div>
</div>
<div id="tags"></div>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
<script type="module" src="./cenario.js"></script>
</body>
</html>

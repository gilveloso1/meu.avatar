</head>
<body>
<div id="ui">
  <nav><a class="on" href="/preview/index.html">Personagens</a><a href="/preview/cenario.html">Cenário</a></nav>
  <label>Vista

      <option value="lineup">Todos os personagens</option>
      <option value="single">Um personagem</option>
